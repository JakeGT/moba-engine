[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# winit -> sctk-adwaita -> ab_glyph -> owned_ttf_parser -> ttf-parser. The font parser is
# unmaintained (RUSTSEC-2026-0192); replacing it requires a winit/ab_glyph upgrade. Remove this
# ignore once a maintained dependency path is available.
ignore = ["RUSTSEC-2026-0192"]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
