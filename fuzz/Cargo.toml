[package]
name = "moba-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
moba-assets = { path = "../crates/assets", features = ["glb", "bc-decode"] }
moba-core = { path = "../crates/core" }
moba-game = { path = "../crates/game" }
moba-net = { path = "../crates/net" }
moba-sim = { path = "../crates/sim" }

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay"
path = "fuzz_targets/replay.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content"
path = "fuzz_targets/content.rs"
test = false
doc = false
bench = false

[[bin]]
name = "glb"
path = "fuzz_targets/glb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ktx2"
path = "fuzz_targets/ktx2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vfx"
path = "fuzz_targets/vfx.rs"
test = false
doc = false
bench = false

[[bin]]
name = "grading"
path = "fuzz_targets/grading.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mesh_lod"
path = "fuzz_targets/mesh_lod.rs"
test = false
doc = false
bench = false

[workspace]
