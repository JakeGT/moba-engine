[package]
name = "moba-render"
description = "Vulkan 1.3 renderer: swapchain, instanced scene, terrain, bitmap HUD and capture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/moba-render"
publish.workspace = true

[lints]
workspace = true

[dependencies]
moba-core.workspace = true
moba-assets = { workspace = true, features = ["bc-decode"] }
ash.workspace = true
ash-window.workspace = true
bytemuck.workspace = true
gpu-allocator.workspace = true
raw-window-handle.workspace = true
moba-platform.workspace = true
moba-shaders.workspace = true
# Plain-data device capabilities (ADR-0020 §1e), dumped by `vulkan-probe --json`.
serde.workspace = true

[dev-dependencies]
# The VAT validation tests load the shipped sample model.
moba-assets = { workspace = true, features = ["bc-decode", "glb"] }
criterion.workspace = true
# The Slang reflection layout test (ADR-0020 §4c).
moba-shaders = { workspace = true, features = ["reflection"] }
# Reads the capability fixtures (ADR-0020 §2b) and the Slang reflection JSON (§4c).
serde_json.workspace = true

[[bench]]
name = "light_binning"
harness = false
