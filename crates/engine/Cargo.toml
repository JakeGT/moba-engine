[package]
name = "moba-engine"
description = "Umbrella crate for the MOBA engine: simulation, networking and optional Vulkan client layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/moba-engine"
publish.workspace = true

[features]
default = ["sim", "net"]
# Headless deterministic simulation and content tables.
sim = ["dep:moba-sim", "dep:moba-core", "dep:moba-ecs", "dep:moba-game", "dep:moba-nav"]
# UDP transport, protocol, prediction and snapshots.
net = ["dep:moba-net", "sim"]
# Vulkan renderer and winit platform. Pulls GPU/windowing dependencies. Includes the open
# build's `fsr3` upscaler feature, which is on by default in moba-render.
render = ["dep:moba-render", "dep:moba-platform", "moba-render/fsr3"]
# moba-render's vendor SDK features, forwarded by name under `render` (ADR-0020 §6a). All
# but `fsr3` need the pinned SDKs (scripts/fetch-sdks.sh); see docs/dev/vendor-sdks.md.
fsr3 = ["render"]
dlss = ["render", "moba-render/dlss"]
streamline = ["render", "moba-render/streamline"]
nrd = ["render", "moba-render/nrd"]
rtxdi = ["render", "moba-render/rtxdi"]
sharc = ["render", "moba-render/sharc"]
fsr4 = ["render", "moba-render/fsr4"]
xess = ["render", "moba-render/xess"]
nvidia = ["dlss", "nrd", "rtxdi", "sharc"]
vendor-sdks = ["nvidia", "fsr4", "xess"]
dlss-fg = ["dlss", "streamline"]

[dependencies]
moba-core = { workspace = true, optional = true }
moba-ecs = { workspace = true, optional = true }
moba-game = { workspace = true, optional = true }
moba-sim = { workspace = true, optional = true }
moba-nav = { workspace = true, optional = true }
moba-net = { workspace = true, optional = true }
moba-render = { workspace = true, optional = true }
moba-platform = { workspace = true, optional = true }

[lints]
workspace = true
