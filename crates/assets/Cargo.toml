[package]
name = "moba-assets"
description = "Asset manifests, fallback resolution and the bounded .glb mesh loader."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/moba-assets"
publish.workspace = true

[lints]
workspace = true

[dependencies]
moba-core.workspace = true
serde.workspace = true
toml.workspace = true
bevy_mikktspace.workspace = true
gltf = { workspace = true, optional = true, features = ["names"] }
bcdec_rs = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
# The reference `MikkTSpace` build (platform `acos`) the deterministic one is checked against.
bevy_mikktspace = { workspace = true, features = ["std"] }
moba-test-support = { path = "../test-support" }

[[bench]]
name = "skin_sample"
harness = false

[[bench]]
name = "vat_minions"
harness = false

[features]
default = []
# Bounded binary glTF (.glb) static-mesh loader (ADR-0007).
glb = ["dep:gltf"]
# CPU decode of BC7/BC5/BC4 textures, the fallback for devices without
# `textureCompressionBC` (ADR-0010).
bc-decode = ["dep:bcdec_rs"]
