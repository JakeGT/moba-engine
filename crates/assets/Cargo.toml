[package]
name = "moba-assets"
description = "Asset manifests, fallback resolution and the bounded .glb mesh loader."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/moba-assets"
publish.workspace = true

[lints]
workspace = true

[dependencies]
moba-core.workspace = true
serde.workspace = true
toml.workspace = true
gltf = { workspace = true, optional = true, features = ["names"] }

[dev-dependencies]
criterion.workspace = true
moba-test-support = { path = "../test-support" }

[[bench]]
name = "skin_sample"
harness = false

[features]
default = []
# Bounded binary glTF (.glb) static-mesh loader (ADR-0007).
glb = ["dep:gltf"]
