[package]
name = "moba-client"
description = "Playable Vulkan client with prediction, interpolation, fog and HUD."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/moba-client"
publish.workspace = true

[lints]
workspace = true

# moba-render's vendor SDK features, forwarded by name (ADR-0020 §6a, docs/dev/vendor-sdks.md).
[features]
default = ["fsr3"]
fsr3 = ["moba-render/fsr3"]
dlss = ["moba-render/dlss"]
streamline = ["moba-render/streamline"]
nrd = ["moba-render/nrd"]
rtxdi = ["moba-render/rtxdi"]
sharc = ["moba-render/sharc"]
fsr4 = ["moba-render/fsr4"]
xess = ["moba-render/xess"]
nvidia = ["dlss", "nrd", "rtxdi", "sharc"]
vendor-sdks = ["nvidia", "fsr4", "xess"]
dlss-fg = ["dlss", "streamline"]

[dependencies]
arrayvec.workspace = true
moba-core.workspace = true
moba-ecs.workspace = true
moba-platform.workspace = true
moba-render.workspace = true
moba-assets = { workspace = true, features = ["glb"] }
moba-sim.workspace = true
moba-game.workspace = true
moba-net.workspace = true
serde.workspace = true
toml.workspace = true
cpal.workspace = true
crossbeam-queue.workspace = true
