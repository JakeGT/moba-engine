ui_scale = 1.0
# Rendering quality tier: low, medium, high or ultra (MOBA_QUALITY overrides it).
quality = "high"
audio_volume = 0.7
audio_mute = false
camera_sensitivity = 1.0
camera_zoom = 240.0
# Team colours for health bars and the minimap: "standard" (green self, blue allies, red
# enemies) or "colorblind" (Okabe-Ito yellow/sky blue/orange). MOBA_TEAM_PALETTE overrides it.
team_palette = "standard"
# GPU particle effects (MOBA_VFX=off overrides) and the opacity of allied effects (0..1).
vfx = true
ally_vfx_opacity = 1.0
# Render resolution relative to the window, 0.5..1 (the HUD stays native). MOBA_RENDER_SCALE
# overrides it; dynamic resolution (Low by default, MOBA_DYNRES) lowers it under load.
render_scale = 1.0
# Accessibility: gameplay screen effects (R6). MOBA_SCREEN_EFFECTS=off turns all three off.
death_desaturation = true   # fade to grey while your hero is dead
damage_vignette = true      # red edge flash when your hero takes damage
low_health_pulse = true     # red edge pulse below 30 % health

[controls]
move_up = "W"
move_down = "S"
move_left = "A"
move_right = "D"
cast_q = "Q"
cast_w = "W"
cast_e = "E"
stop = "Space"
shop = "B"
scoreboard = "Tab"
ready = "R"
surrender = "F5"
attack_button = "left"
camera_left = "Left"
camera_right = "Right"
camera_up = "Up"
camera_down = "Down"
