# perf-gate baseline (R8, ADR-0018 §6; docs/perf/0022-r8-scaling-pacing.md).
#
# Measured 2026-10-30 on `main` at 197857b (after R3b, R8 and distortion) with
# scripts/perf-replay.sh (teamfight --ticks 18000, a physical 1920x1080, vsync off,
# validation off, warm pipeline cache) on an NVIDIA GeForce RTX 5070 Ti (driver 615.78.08),
# AMD Ryzen 7 9800X3D, CachyOS Linux 7.3, with the GPU's memory clock at P0 (14001 MHz)
# throughout: two displays were attached. At the idle memory clock (405 MHz, one display) the
# same replay's GPU p95 is up to 1.75x higher on Low and Medium (perf/0022), so compare runs
# in the same power state. perf-gate fails a run whose gpu_total_p95_ms or render_p95_ms
# grows past these by more than --max-regression (25 %, with a 0.05 ms noise floor). The gate
# fails a run on any other GPU (the log's gpu=), so a different runner needs its own
# baseline: run `BASELINE= scripts/perf-replay.sh` there and replace this file. Every tier
# table needs both keys; unknown keys are an error.

gpu = "NVIDIA GeForce RTX 5070 Ti"

[low]
gpu_total_p95_ms = 0.206
render_p95_ms = 0.191

[medium]
gpu_total_p95_ms = 0.301
render_p95_ms = 0.218

[high]
gpu_total_p95_ms = 0.490
render_p95_ms = 0.199

[ultra]
gpu_total_p95_ms = 0.664
render_p95_ms = 0.254

# Tiered path (ADR-0021 amendment 2 item 16, amendment 5 item 18;
# docs/perf/0034-vendor-upscalers.md). Re-recorded 2026-11-14 by N1c, the last N1 part, on
# feat/n1c-vendor-upscalers (code as 7bdff2e: N1a, N1b stage 2, N1c and N1d merged), with
# scripts/perf-replay.sh's conditions (teamfight --ticks 18000, a physical 1920x1080, vsync
# off, validation off, warm pipeline cache), the open build (no vendor features) and TAAU,
# on the same GPU (driver 620.70.06, memory clock at P0, 14001 MHz, two displays): the
# median of three interleaved rounds per tier, run under the GPU lock with no other client.
# Since then a Tiered regression, a missing table, another GPU or another upscaler fails
# perf-gate (`TIERED_BASELINE_FAILS = true`), as on Compat. Each table names its upscaler
# (ADR-0021 §7, amendment 5): a run with another one (a DLSS build) is a breach, never
# compared or re-recorded. Tiered High runs the Ultra configuration, so the two tables are
# close. render_p95_ms is CPU render-thread time and moves with machine load (0.278-0.349 ms
# across these rounds); the 0.05 ms noise floor and 25 % allowance cover that spread.

[tiered.low]
upscaler = "taau"
gpu_total_p95_ms = 0.514
render_p95_ms = 0.311

[tiered.high]
upscaler = "taau"
gpu_total_p95_ms = 0.566
render_p95_ms = 0.300

[tiered.ultra]
upscaler = "taau"
gpu_total_p95_ms = 0.566
render_p95_ms = 0.310
