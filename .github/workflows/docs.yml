name: docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "scripts/check-docs.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links-and-contract:
    name: docs links + contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check relative links, versions and test counts
        run: ./scripts/check-docs.sh
