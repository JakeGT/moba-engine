name: macos vulkan probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/render/**'
      - 'crates/shaders/**'
      - 'crates/platform/**'
      - 'crates/client/**'
      - 'crates/tools/**'
      - '.github/workflows/macos-vulkan.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  moltenvk:
    name: MoltenVK instance/device probe
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install MoltenVK
        run: |
          brew install molten-vk vulkan-loader glslang
          PREFIX=$(brew --prefix molten-vk)
          LOADER=$(brew --prefix vulkan-loader)
          ICD=$(find "$PREFIX/share/vulkan/icd.d" "$PREFIX/etc/vulkan/icd.d" -name 'MoltenVK_icd.json' 2>/dev/null | head -1)
          test -n "$ICD" || { echo "MoltenVK ICD json not found"; find "$PREFIX" -name '*icd*.json'; exit 1; }
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PREFIX/lib:$LOADER/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          ls "$LOADER/lib"
          echo "Using $ICD"
      - name: Build probe
        run: cargo build --release --locked -p moba-tools --bin vulkan-probe
      - name: Probe instance and devices
        # ADR-0020 gate 2: macOS is Compat only, so the chosen device must report path=compat.
        # Even forcing the tiered path must stay Compat (vulkan-probe then exits 1).
        # The tiered run must fail for the right reason (not a loader crash), and the dump must
        # come from MoltenVK itself (driver ID 14), not only from the macOS host rule.
        run: |
          set -euo pipefail
          ./target/release/vulkan-probe | tee probe.txt
          grep -q '^chosen: .* path=compat ' probe.txt
          if ./target/release/vulkan-probe --path tiered 2> tiered.txt; then
            echo "--path tiered admitted a device on macOS" >&2
            exit 1
          fi
          cat tiered.txt
          grep -q 'no device is admitted to the tiered path' tiered.txt
          ./target/release/vulkan-probe --json > capabilities.json
          python3 -c 'import json, sys; d = json.load(open("capabilities.json")); sys.exit(0 if any(x["driver_id"] == 14 for x in d) else "no MoltenVK device (driver ID 14) in the dump")'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: moltenvk-capabilities
          path: |
            probe.txt
            tiered.txt
            capabilities.json
          if-no-files-found: ignore
