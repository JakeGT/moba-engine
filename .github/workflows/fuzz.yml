name: sanitizer fuzz

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "120"
  schedule:
    - cron: "0 4 * * 6"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-fuzz:
    name: ASan decoder fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz wire
        run: cargo +nightly fuzz run wire -- -max_total_time=${{ inputs.seconds || '120' }} -print_final_stats=1
      - name: Fuzz replay
        run: cargo +nightly fuzz run replay -- -max_total_time=${{ inputs.seconds || '120' }} -print_final_stats=1
      - name: Fuzz content
        run: cargo +nightly fuzz run content -- -max_total_time=${{ inputs.seconds || '120' }} -print_final_stats=1
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
