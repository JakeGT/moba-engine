name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs; never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gates:
    name: gates (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Exclude workspace from Windows Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest
      - name: Install shader compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools libxkbcommon-dev libwayland-dev
      - name: Install shader compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install glslang
      - name: Install shader compiler (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $roots = @($env:VULKAN_SDK, 'C:\VulkanSDK', "$env:ProgramFiles\VulkanSDK") |
            Where-Object { $_ -and (Test-Path $_) }
          $glslc = Get-ChildItem $roots -Recurse -Filter glslc.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $glslc) { throw "glslc.exe not found under $roots" }
          "GLSLC=$($glslc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using $($glslc.FullName)"
      # Server/sim tests need no GPU; renderer tests use lavapipe in a later stage.
      - run: just ci-core

  tools:
    name: tools + deterministic soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - run: just ci-tools

  release-tests:
    name: release tests + doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - run: cargo test --workspace --release --locked
      - run: cargo test --workspace --doc --locked

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - run: cargo check --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just miri
