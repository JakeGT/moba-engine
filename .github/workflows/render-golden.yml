name: render golden

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  MOBA_VULKAN_VALIDATION: required
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  renderer-gate:
    name: renderer-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            renderer:
              - 'crates/render/**'
              - 'crates/shaders/**'
              - 'crates/platform/**'
              - 'crates/client/**'
              - 'crates/assets/**'
              # The networked golden also depends on the simulation, wire and content.
              - 'crates/core/**'
              - 'crates/game/**'
              - 'crates/sim/**'
              - 'crates/net/**'
              - 'content/**'
              - 'tests/golden/**'
              - '.github/workflows/render-golden.yml'
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
      - name: Install software Vulkan
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-validationlayers libvulkan1 \
            glslang-tools libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev xvfb
          ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          test -n "$ICD" || { echo "lavapipe ICD not found"; exit 1; }
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=/usr/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "Using $ICD"
      - name: Build client and tools
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: cargo build --release --locked -p moba-client -p moba-tools
      - name: Capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 180 xvfb-run -a ./target/release/moba-client \
            > capture.log 2>&1 || { cat capture.log; exit 1; }
          test -s render-actual.ppm
        env:
          MOBA_SMOKE_FRAMES: "120"
          MOBA_CAPTURE: render-actual.ppm
          MOBA_CAPTURE_FRAME: "90"
      - name: Compare fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-actual.ppm \
            --expected tests/golden/render-fingerprint.rgb \
            --diff render-diff.ppm > fingerprint.log 2>&1
          status=$?
          cat fingerprint.log
          exit $status
      # Networked golden: an in-process loopback server (MOBA_SERVER=local) with GPU-skinned
      # heroes. MOBA_CAPTURE_TICK lock-steps the local server to the client and pins
      # interpolation/animation to tick 120, so the frame does not depend on runner speed.
      - name: Networked capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 300 xvfb-run -a ./target/release/moba-client \
            > network-capture.log 2>&1 || { cat network-capture.log; exit 1; }
          cat network-capture.log
          test -s render-network-actual.ppm
        env:
          MOBA_SERVER: local
          MOBA_HERO_MODELS: sentinel-skinned
          MOBA_CAPTURE_TICK: "120"
          MOBA_SMOKE_FRAMES: "100000"
          MOBA_CAPTURE: render-network-actual.ppm
      - name: Compare network fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-network-actual.ppm \
            --expected tests/golden/render-network-fingerprint.rgb \
            --diff render-network-diff.ppm > network-fingerprint.log 2>&1
          status=$?
          cat network-fingerprint.log
          exit $status
      # VAT golden (R4b): 64 stress minions in the local preview at 40 m, pinned (one tick per
      # frame), so the vertex-animation-texture path is checked pixel-wise.
      - name: VAT capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 180 xvfb-run -a ./target/release/moba-client \
            > vat-capture.log 2>&1 || { cat vat-capture.log; exit 1; }
          test -s render-vat-actual.ppm
        env:
          MOBA_STRESS_MINIONS: "64"
          MOBA_LOCAL_CAMERA_DISTANCE: "40"
          MOBA_SMOKE_FRAMES: "120"
          MOBA_CAPTURE: render-vat-actual.ppm
          MOBA_CAPTURE_FRAME: "90"
      - name: Compare VAT fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-vat-actual.ppm \
            --expected tests/golden/render-vat-fingerprint.rgb \
            --diff render-vat-diff.ppm > vat-fingerprint.log 2>&1
          status=$?
          cat vat-fingerprint.log
          exit $status
      # Post topologies (R6, ADR-0015): Ultra (MSAA 4x + GTAO, with VAT minions through the
      # multisampled pipelines and the depth prepass) and Low at a fixed render scale below 1
      # (FXAA fast + the bilinear upscale). Captures pin dynres, eye adaptation and the
      # screen effects off.
      - name: Ultra capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 240 xvfb-run -a ./target/release/moba-client \
            > ultra-capture.log 2>&1 || { cat ultra-capture.log; exit 1; }
          test -s render-ultra-actual.ppm
        env:
          MOBA_QUALITY: ultra
          MOBA_STRESS_MINIONS: "64"
          MOBA_LOCAL_CAMERA_DISTANCE: "40"
          MOBA_SMOKE_FRAMES: "120"
          MOBA_CAPTURE: render-ultra-actual.ppm
          MOBA_CAPTURE_FRAME: "90"
      - name: Compare Ultra fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-ultra-actual.ppm \
            --expected tests/golden/render-ultra-fingerprint.rgb \
            --diff render-ultra-diff.ppm > ultra-fingerprint.log 2>&1
          status=$?
          cat ultra-fingerprint.log
          exit $status
      - name: Low scaled capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 180 xvfb-run -a ./target/release/moba-client \
            > low-capture.log 2>&1 || { cat low-capture.log; exit 1; }
          test -s render-low-actual.ppm
        env:
          MOBA_QUALITY: low
          MOBA_RENDER_SCALE: "0.75"
          MOBA_SMOKE_FRAMES: "120"
          MOBA_CAPTURE: render-low-actual.ppm
          MOBA_CAPTURE_FRAME: "90"
      - name: Compare Low scaled fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-low-actual.ppm \
            --expected tests/golden/render-low-fingerprint.rgb \
            --diff render-low-diff.ppm > low-fingerprint.log 2>&1
          status=$?
          cat low-fingerprint.log
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-golden
          path: |
            render-actual.ppm
            render-diff.ppm
            capture.log
            fingerprint.log
            render-network-actual.ppm
            render-network-diff.ppm
            network-capture.log
            network-fingerprint.log
            render-vat-actual.ppm
            render-vat-diff.ppm
            vat-capture.log
            vat-fingerprint.log
            render-ultra-actual.ppm
            render-ultra-diff.ppm
            ultra-capture.log
            ultra-fingerprint.log
            render-low-actual.ppm
            render-low-diff.ppm
            low-capture.log
            low-fingerprint.log
          if-no-files-found: ignore
