name: render golden

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  MOBA_VULKAN_VALIDATION: required
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  renderer-gate:
    name: renderer-gate
    runs-on: ubuntu-latest
    # Fifteen lavapipe captures (ADR-0019 added the distortion one and a bloom-off pair),
    # the outline probe and the R8 culling probe's five extra captures run in sequence; the
    # limit is a safety margin above that.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            renderer:
              - 'crates/render/**'
              - 'crates/shaders/**'
              - 'crates/platform/**'
              - 'crates/client/**'
              - 'crates/assets/**'
              # The networked golden also depends on the simulation, wire and content.
              - 'crates/core/**'
              - 'crates/game/**'
              - 'crates/sim/**'
              - 'crates/net/**'
              - 'content/**'
              - 'tests/golden/**'
              - '.github/workflows/render-golden.yml'
              - 'scripts/outline-probe.sh'
              - 'scripts/cull-probe.sh'
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
      - name: Install software Vulkan
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-validationlayers libvulkan1 \
            glslang-tools libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev xvfb
          ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          test -n "$ICD" || { echo "lavapipe ICD not found"; exit 1; }
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=/usr/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "Using $ICD"
      - name: Build client and tools
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: cargo build --release --locked -p moba-client -p moba-tools
      - name: Capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 180 xvfb-run -a ./target/release/moba-client \
            > capture.log 2>&1 || { cat capture.log; exit 1; }
          test -s render-actual.ppm
        env:
          MOBA_SMOKE_FRAMES: "120"
          MOBA_CAPTURE: render-actual.ppm
          MOBA_FRAME_LOG: render.frames
          MOBA_CAPTURE_FRAME: "90"
      - name: Compare fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-actual.ppm \
            --expected tests/golden/render-fingerprint.rgb \
            --diff render-diff.ppm > fingerprint.log 2>&1
          status=$?
          cat fingerprint.log
          exit $status
      # Networked golden: an in-process loopback server (MOBA_SERVER=local) with GPU-skinned
      # heroes. MOBA_CAPTURE_TICK lock-steps the local server to the client and pins
      # interpolation/animation to tick 120, so the frame does not depend on runner speed.
      - name: Networked capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 300 xvfb-run -a ./target/release/moba-client \
            > network-capture.log 2>&1 || { cat network-capture.log; exit 1; }
          cat network-capture.log
          test -s render-network-actual.ppm
        env:
          MOBA_SERVER: local
          MOBA_HERO_MODELS: sentinel-skinned
          MOBA_CAPTURE_TICK: "120"
          MOBA_SMOKE_FRAMES: "100000"
          MOBA_CAPTURE: render-network-actual.ppm
      - name: Compare network fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-network-actual.ppm \
            --expected tests/golden/render-network-fingerprint.rgb \
            --diff render-network-diff.ppm > network-fingerprint.log 2>&1
          status=$?
          cat network-fingerprint.log
          exit $status
      # Ember golden (R2b): the networked match on the walled ember map at 24 m, so wall
      # occlusion, baked AO, the outlines beside walls and effect lights are checked
      # pixel-wise (the default map has no walls or props).
      - name: Ember capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 300 xvfb-run -a ./target/release/moba-client \
            > ember-capture.log 2>&1 || { cat ember-capture.log; exit 1; }
          grep -F "baked AO" ember-capture.log || true
          test -s render-ember-actual.ppm
        env:
          MOBA_SERVER: local
          MOBA_HERO_MODELS: sentinel-skinned
          MOBA_CONTENT: content/ember-map.toml
          MOBA_CAMERA_DISTANCE: "24"
          MOBA_CAPTURE_TICK: "120"
          MOBA_SMOKE_FRAMES: "100000"
          MOBA_CAPTURE: render-ember-actual.ppm
      - name: Compare ember fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-ember-actual.ppm \
            --expected tests/golden/render-ember-fingerprint.rgb \
            --diff render-ember-diff.ppm > ember-fingerprint.log 2>&1
          status=$?
          cat ember-fingerprint.log
          exit $status
      # Outlines never show a unit through a wall (R2b): hidden == outlines off, byte for byte,
      # on the hull and screen paths; the open control must differ.
      - name: Outline occlusion probe
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: scripts/outline-probe.sh ./target/release/moba-client outline-probe
        env:
          RUN: xvfb-run -a
      # VAT golden (R4b): 64 stress minions in the local preview at 40 m, pinned (one tick per
      # frame), so the vertex-animation-texture path is checked pixel-wise.
      - name: VAT capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 180 xvfb-run -a ./target/release/moba-client \
            > vat-capture.log 2>&1 || { cat vat-capture.log; exit 1; }
          test -s render-vat-actual.ppm
        env:
          MOBA_STRESS_MINIONS: "64"
          MOBA_LOCAL_CAMERA_DISTANCE: "40"
          MOBA_SMOKE_FRAMES: "120"
          MOBA_CAPTURE: render-vat-actual.ppm
          MOBA_CAPTURE_FRAME: "90"
      - name: Compare VAT fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-vat-actual.ppm \
            --expected tests/golden/render-vat-fingerprint.rgb \
            --diff render-vat-diff.ppm > vat-fingerprint.log 2>&1
          status=$?
          cat vat-fingerprint.log
          exit $status
      # Post topologies (R6, ADR-0015): Ultra (MSAA 4x + GTAO, with VAT minions through the
      # multisampled pipelines and the depth prepass) and Low at a fixed render scale below 1
      # (FXAA fast + the bilinear upscale). Captures pin dynres, eye adaptation and the
      # screen effects off.
      - name: Ultra capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 240 xvfb-run -a ./target/release/moba-client \
            > ultra-capture.log 2>&1 || { cat ultra-capture.log; exit 1; }
          test -s render-ultra-actual.ppm
        env:
          MOBA_QUALITY: ultra
          MOBA_STRESS_MINIONS: "64"
          MOBA_LOCAL_CAMERA_DISTANCE: "40"
          MOBA_SMOKE_FRAMES: "120"
          MOBA_CAPTURE: render-ultra-actual.ppm
          MOBA_FRAME_LOG: render-ultra.frames
          MOBA_CAPTURE_FRAME: "90"
      - name: Compare Ultra fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-ultra-actual.ppm \
            --expected tests/golden/render-ultra-fingerprint.rgb \
            --diff render-ultra-diff.ppm > ultra-fingerprint.log 2>&1
          status=$?
          cat ultra-fingerprint.log
          exit $status
      - name: Low scaled capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 180 xvfb-run -a ./target/release/moba-client \
            > low-capture.log 2>&1 || { cat low-capture.log; exit 1; }
          test -s render-low-actual.ppm
        env:
          MOBA_QUALITY: low
          MOBA_RENDER_SCALE: "0.75"
          MOBA_SMOKE_FRAMES: "120"
          MOBA_CAPTURE: render-low-actual.ppm
          MOBA_FRAME_LOG: render-low.frames
          MOBA_CAPTURE_FRAME: "90"
      - name: Compare Low scaled fingerprint
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-low-actual.ppm \
            --expected tests/golden/render-low-fingerprint.rgb \
            --diff render-low-diff.ppm > low-fingerprint.log 2>&1
          status=$?
          cat low-fingerprint.log
          exit $status
      # R3a map coverage (ADR-0014): the terrain, fog of war, height fog, sky and map edge
      # from two more cameras. The whole-map overview is networked (fog of war from the blue
      # team's vision, pinned to tick 120); the horizon view is the local preview's low
      # orbit, where the sky and the map-edge hills fill the top of the frame.
      - name: Map overview and horizon captures with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          MOBA_SERVER=local MOBA_HERO_MODELS=sentinel-skinned MOBA_CAPTURE_TICK=120 \
            MOBA_SMOKE_FRAMES=100000 MOBA_CAMERA=overview MOBA_CAPTURE=render-overview-actual.ppm \
            timeout 300 xvfb-run -a ./target/release/moba-client \
            > overview-capture.log 2>&1 || { cat overview-capture.log; exit 1; }
          test -s render-overview-actual.ppm
          MOBA_SMOKE_FRAMES=120 MOBA_CAPTURE_FRAME=90 MOBA_PREVIEW_CAMERA=-0.7,0.12,170 \
            MOBA_CAPTURE=render-horizon-actual.ppm MOBA_FRAME_LOG=render-horizon.frames \
            timeout 180 xvfb-run -a ./target/release/moba-client \
            > horizon-capture.log 2>&1 || { cat horizon-capture.log; exit 1; }
          test -s render-horizon-actual.ppm
      - name: Compare map fingerprints
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          status=0
          for view in overview horizon; do
            ./target/release/image-check render-$view-actual.ppm \
              --expected tests/golden/render-$view-fingerprint.rgb \
              --diff render-$view-diff.ppm > $view-fingerprint.log 2>&1 || status=1
            cat $view-fingerprint.log
          done
          exit $status
      # Culling never changes what a player sees (R8, ADR-0018 §1): five scenes (the preview,
      # the horizon view, Ultra with VAT minions, Low with hull outlines, the networked match)
      # must be byte-identical with culling on and MOBA_GPU_CULL=off, and something must have
      # been culled. For the four local scenes the culled images are the golden captures
      # above (same environment, culling on by default, with frame logs), so the probe adds
      # only their culling-off captures; the networked scene captures its own pair at
      # 640x360 (its HUD can differ by a few pixels between separate runs). Any validation
      # message fails.
      - name: Culling exactness probe
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: scripts/cull-probe.sh ./target/release/moba-client cull-probe
        env:
          RUN: xvfb-run -a
          CULL_PROBE_REUSE: .
      # R3b environment coverage (ADR-0017): the showcase river close up from a low camera on
      # the default tier (full water with refraction, foliage, reeds, the carved bed), on Low
      # (simple water, thinned foliage) and on Ultra through the reeds on the bank (4x MSAA
      # with the prepass: the scene re-resolves its depth, so the water stays behind the
      # reeds in front of it), and the 5v5 teamfight replay at tick 360 (ground decals:
      # telegraph rings, scorch and splats, with water and foliage). Local captures advance
      # one tick and one VFX step per frame, so the replay frame is repeatable.
      - name: Environment captures with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          for quality in default low ultra; do
            name=river
            extra=""
            camera=0.9,0.3,14,4,-62
            if [ "$quality" = low ]; then name=river-low; extra="MOBA_QUALITY=low"; fi
            if [ "$quality" = ultra ]; then
              name=river-ultra; extra="MOBA_QUALITY=ultra"; camera=4.04,0.2,9,4,-62
            fi
            env $extra MOBA_SMOKE_FRAMES=120 MOBA_CAPTURE_FRAME=90 \
              MOBA_PREVIEW_CAMERA=$camera MOBA_CAPTURE=render-$name-actual.ppm \
              timeout 180 xvfb-run -a ./target/release/moba-client \
              > $name-capture.log 2>&1 || { cat $name-capture.log; exit 1; }
            test -s render-$name-actual.ppm
          done
          MOBA_REPLAY=tests/replays/teamfight-5v5.mbr MOBA_WARMUP_TICKS=330 \
            MOBA_CAMERA_DISTANCE=30 MOBA_CAPTURE_FRAME=30 MOBA_SMOKE_FRAMES=40 \
            MOBA_CAPTURE=render-decals-actual.ppm \
            timeout 300 xvfb-run -a ./target/release/moba-client \
            > decals-capture.log 2>&1 || { cat decals-capture.log; exit 1; }
          test -s render-decals-actual.ppm
      - name: Compare environment fingerprints
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          status=0
          for view in river river-low river-ultra decals; do
            ./target/release/image-check render-$view-actual.ppm \
              --expected tests/golden/render-$view-fingerprint.rgb \
              --diff render-$view-diff.ppm > $view-fingerprint.log 2>&1 || status=1
            cat $view-fingerprint.log
          done
          exit $status
      # ADR-0019: heat haze on Ultra (MSAA resolved, the prepass unit mask, the telegraph
      # mark, a stand-in unit at the haze's edge). The fingerprint's tolerance cannot see a
      # few-pixel shimmer, so the same pinned frame is captured twice more with bloom off,
      # drawn and with MOBA_DISTORTION=nodraw (every haze spawn and its simulation identical,
      # only the refraction skipped; `off` would change the particle RNG): every log must show
      # live haze sprites (vfx_distortion_max > 0), the pair must differ by at least 5000
      # pixels (18.9k on lavapipe), and boxes inside both stand-in units must be
      # byte-identical. Bloom is off in the pair because it blurs the haze's HDR change ~40 px
      # past the haze at 1-2 LSB (it reached a flat face of the red stand-in, 27 px from the
      # nearest refracted pixel, on the runner's LLVM 21 lavapipe): that is the post chain,
      # not the unit mask, and every other post pass is per-pixel.
      - name: Distortion capture with validation + sync validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          timeout 180 xvfb-run -a ./target/release/moba-client \
            > distortion-capture.log 2>&1 || { cat distortion-capture.log; exit 1; }
          test -s render-distortion-actual.ppm
          if grep -F "distortion off" distortion-capture.log; then exit 1; fi
          grep -Eo "vfx_distortion_max=[0-9.]+" distortion-capture.log | tail -1 \
            | grep -Ev "=0(\.0+)?$" || { cat distortion-capture.log; exit 1; }
          grep -Eo "gpu_distortion_runs=[1-9][0-9]*" distortion-capture.log | tail -1 \
            | grep . || { cat distortion-capture.log; exit 1; }
        env:
          MOBA_VFX_PREVIEW: cinder-zone
          MOBA_QUALITY: ultra
          MOBA_SMOKE_FRAMES: "120"
          MOBA_CAPTURE_FRAME: "90"
          MOBA_CAPTURE: render-distortion-actual.ppm
          MOBA_FRAME_LOG: render-distortion.frames
      - name: Distortion bloom-off pair (drawn and no-draw) with validation
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          MOBA_CAPTURE=render-distortion-flat.ppm MOBA_FRAME_LOG=render-distortion-flat.frames \
            timeout 180 xvfb-run -a ./target/release/moba-client \
            > distortion-flat-capture.log 2>&1 || { cat distortion-flat-capture.log; exit 1; }
          test -s render-distortion-flat.ppm
          if grep -F "distortion off" distortion-flat-capture.log; then exit 1; fi
          grep -Eo "vfx_distortion_max=[0-9.]+" distortion-flat-capture.log | tail -1 \
            | grep -Ev "=0(\.0+)?$" || { cat distortion-flat-capture.log; exit 1; }
          grep -Eo "gpu_distortion_runs=[1-9][0-9]*" distortion-flat-capture.log | tail -1 \
            | grep . || { cat distortion-flat-capture.log; exit 1; }
          MOBA_DISTORTION=nodraw MOBA_CAPTURE=render-distortion-nodraw.ppm \
            MOBA_FRAME_LOG=render-distortion-nodraw.frames \
            timeout 180 xvfb-run -a ./target/release/moba-client \
            > distortion-nodraw-capture.log 2>&1 \
            || { cat distortion-nodraw-capture.log; exit 1; }
          test -s render-distortion-nodraw.ppm
          grep -Eo "vfx_distortion_max=[0-9.]+" distortion-nodraw-capture.log | tail -1 \
            | grep -Ev "=0(\.0+)?$" || { cat distortion-nodraw-capture.log; exit 1; }
          if grep -F "gpu_distortion_runs" distortion-nodraw-capture.log; then exit 1; fi
        env:
          MOBA_VFX_PREVIEW: cinder-zone
          MOBA_QUALITY: ultra
          MOBA_BLOOM: "off"
          MOBA_SMOKE_FRAMES: "120"
          MOBA_CAPTURE_FRAME: "90"

      - name: Compare distortion fingerprint and the drawn haze
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          set +e
          ./target/release/image-check render-distortion-actual.ppm \
            --expected tests/golden/render-distortion-fingerprint.rgb \
            --diff render-distortion-diff.ppm > distortion-fingerprint.log 2>&1
          status=$?
          if cmp -s render-distortion-flat.ppm render-distortion-nodraw.ppm; then
            echo "the haze changed no pixel" >> distortion-fingerprint.log
            status=1
          fi
          # The red stand-in (at the haze's edge) and the blue one: their faces, never bent.
          ./target/release/image-check render-distortion-flat.ppm \
            --against render-distortion-nodraw.ppm --min-changed 5000 \
            --same-box 640,448,684,505 --same-box 700,245,732,300 \
            --diff render-distortion-haze.ppm >> distortion-fingerprint.log 2>&1 || status=1
          cat distortion-fingerprint.log
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-golden
          path: |
            render-actual.ppm
            render-diff.ppm
            capture.log
            fingerprint.log
            render-network-actual.ppm
            render-network-diff.ppm
            network-capture.log
            network-fingerprint.log
            render-vat-actual.ppm
            render-vat-diff.ppm
            vat-capture.log
            vat-fingerprint.log
            render-ember-actual.ppm
            render-ember-diff.ppm
            ember-capture.log
            ember-fingerprint.log
            outline-probe/
            cull-probe/
            render*.frames
            render-ultra-actual.ppm
            render-ultra-diff.ppm
            ultra-capture.log
            ultra-fingerprint.log
            render-low-actual.ppm
            render-low-diff.ppm
            low-capture.log
            low-fingerprint.log
            render-overview-actual.ppm
            render-overview-diff.ppm
            overview-capture.log
            overview-fingerprint.log
            render-horizon-actual.ppm
            render-horizon-diff.ppm
            horizon-capture.log
            horizon-fingerprint.log
            render-river-actual.ppm
            render-river-diff.ppm
            river-capture.log
            river-fingerprint.log
            render-river-low-actual.ppm
            render-river-low-diff.ppm
            river-low-capture.log
            river-low-fingerprint.log
            render-river-ultra-actual.ppm
            render-river-ultra-diff.ppm
            river-ultra-capture.log
            river-ultra-fingerprint.log
            render-decals-actual.ppm
            render-decals-diff.ppm
            decals-capture.log
            decals-fingerprint.log
            render-distortion-actual.ppm
            render-distortion-diff.ppm
            render-distortion-nodraw.ppm
            render-distortion-flat.ppm
            distortion-flat-capture.log
            render-distortion-haze.ppm
            distortion-capture.log
            distortion-nodraw-capture.log
            distortion-fingerprint.log
          if-no-files-found: ignore
