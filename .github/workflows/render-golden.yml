  # ADR-0021 (N1b): FSR 3.1's tiered probes and goldens, in parallel with renderer-gate
  # (everything in one job ran about 64 minutes once FSR 3.1 joined it).
  tiered-temporal:
    name: tiered-temporal
    # Pinned with renderer-gate (the exact tiered hashes are keyed on the image's lavapipe).
    runs-on: ubuntu-26.04
    # The FSR 3.1 ghost probe (three modes), four overlay cases (with TAAU Quality as the
    # reference) and eight tiered captures plus a reset run.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      # The runner's CPU: llvmpipe JITs its shaders for the host CPU, so the exact tiered
      # hashes are read against it (tests/golden/render-tiered-hashes.txt).
      - name: Runner CPU
        run: |
          lscpu
          echo "nproc: $(nproc)"
          for flag in avx2 fma avx512f avx512vl avx512bw; do
            grep -qw "$flag" /proc/cpuinfo && echo "cpu flag: $flag" || echo "cpu flag: no $flag"
          done
      - uses: dorny/paths-filter@v4
        id: changes
        if: github.event_name == 'pull_request'
        with:
          filters: |
            renderer:
              - 'crates/render/**'
              - 'crates/shaders/**'
              - 'crates/platform/**'
              - 'crates/client/**'
              - 'crates/assets/**'
              # The networked golden also depends on the simulation, wire and content.
              - 'crates/core/**'
              - 'crates/game/**'
              - 'crates/sim/**'
              - 'crates/net/**'
              - 'content/**'
              - 'tests/golden/**'
              - '.github/workflows/render-golden.yml'
              - 'scripts/outline-probe.sh'
              - 'scripts/cull-probe.sh'
              # ADR-0021: the tiered temporal probes and goldens.
              - 'scripts/motion-probe.sh'
              - 'scripts/ghost-probe.sh'
              - 'scripts/overlay-invariance.sh'
              - 'scripts/tiered-goldens.sh'
              # ADR-0020 gate 3: the tiered smoke binaries.
              - 'crates/tools/src/tiered_smoke.rs'
              - 'crates/tools/src/bin/bindless-smoke.rs'
              - 'crates/tools/src/bin/rt-smoke.rs'
              # ADR-0021 §4b (N1b): the FSR 3.1.6 port, its vendored shaders and its smoke.
              - 'crates/tools/src/bin/fsr3-smoke.rs'
              - 'third_party/**'
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
      - uses: ./.github/actions/setup-slang
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
      - name: Install software Vulkan
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-validationlayers libvulkan1 \
            glslang-tools spirv-tools libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev xvfb
          ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          test -n "$ICD" || { echo "lavapipe ICD not found"; exit 1; }
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=/usr/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "Using $ICD"
      - name: Build client and tools
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: cargo build --release --locked -p moba-client -p moba-tools
      # ADR-0021 (N1b): FSR 3.1's cases of the tiered probes and goldens, on lavapipe with
      # validation + sync validation; TAAU's run in renderer-gate. This job should become a
      # required check (a repository ruleset change; ADR-0021 amendment 4 item 16).
      - name: Tiered ghost-energy probe, FSR 3.1 (ADR-0021 gate 3)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: scripts/ghost-probe.sh ./target/release/moba-client ghost-probe
        env:
          RUN: xvfb-run -a
          UPSCALERS: fsr3
      - name: Tiered overlay invariance, FSR 3.1 (ADR-0021 gate 3)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: scripts/overlay-invariance.sh ./target/release/moba-client overlay-invariance
        env:
          RUN: xvfb-run -a
          UPSCALERS: fsr3
      - name: Tiered goldens, FSR 3.1 (ADR-0021 gate 4)
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.renderer == 'true'
        run: |
          scripts/tiered-goldens.sh ./target/release/moba-client ./target/release/image-check \
            tiered-goldens
        env:
          RUN: xvfb-run -a
          UPSCALERS: fsr3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tiered-temporal
          path: |
            ghost-probe
            overlay-invariance
            tiered-goldens

  # TEMPORARY (removed before this PR is marked ready): samples the tiered goldens' hashes on
  # several runners at once, to tabulate them against the runner's CPU.
  tiered-cpu-sample:
    name: tiered-cpu-sample (${{ matrix.sample }})
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - name: Runner CPU
        run: |
          lscpu
          echo "nproc: $(nproc)"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tiered-cpu-sample
          save-if: ${{ matrix.sample == 1 }}
      - uses: ./.github/actions/setup-slang
      - name: Install software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers vulkan-validationlayers libvulkan1 \
            glslang-tools spirv-tools libasound2-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev xvfb
          ICD=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          test -n "$ICD" || { echo "lavapipe ICD not found"; exit 1; }
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=/usr/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
      - name: Build client and tools
        run: cargo build --release --locked -p moba-client -p moba-tools
      - name: llvmpipe's CPU caps
        run: GALLIUM_DUMP_CPU=1 ./target/release/vulkan-probe 2>&1 | grep -E 'util_cpu_caps|llvmpipe' || true
        env:
          MOBA_RENDER_PATH: tiered
      - name: Tiered goldens, TAAU
        continue-on-error: true
        run: scripts/tiered-goldens.sh ./target/release/moba-client ./target/release/image-check tiered-goldens
        env:
          RUN: xvfb-run -a
          MOBA_RENDER_PATH: tiered
          UPSCALERS: taau
      - name: Tiered goldens, FSR 3.1
        continue-on-error: true
        run: scripts/tiered-goldens.sh ./target/release/moba-client ./target/release/image-check tiered-goldens
        env:
          RUN: xvfb-run -a
          MOBA_RENDER_PATH: tiered
          UPSCALERS: fsr3
      # Does llvmpipe without AVX-512 (Mesa's GALLIUM_OVERRIDE_CPU_CAPS=avx clears avx512f)
      # converge across CPUs? Evidence only.
      - name: Tiered goldens, FSR 3.1, GALLIUM_OVERRIDE_CPU_CAPS=avx
        continue-on-error: true
        run: scripts/tiered-goldens.sh ./target/release/moba-client ./target/release/image-check tiered-goldens-noavx512
        env:
          RUN: xvfb-run -a
          MOBA_RENDER_PATH: tiered
          UPSCALERS: fsr3
          GALLIUM_OVERRIDE_CPU_CAPS: avx
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tiered-cpu-sample-${{ matrix.sample }}
          path: |
            tiered-goldens
            tiered-goldens-noavx512
          if-no-files-found: ignore
