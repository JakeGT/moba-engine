name: nightly hardening

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: Wire-fuzz duration in seconds
        default: "3600"
      soak_seconds:
        description: Network soak duration in seconds
        default: "300"
      match_count:
        description: Deterministic matches
        default: "50"

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  soak:
    name: 10-client lossy soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libasound2-dev
      - run: |
          cargo run --release --locked -p moba-tools --bin soak -- --seconds ${{ inputs.soak_seconds || '300' }} 2>&1 | tee soak.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-log
          path: soak.log

  fuzz:
    name: one-hour wire fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libasound2-dev
      - run: |
          cargo run --release --locked -p moba-tools --bin fuzz-wire -- --seconds ${{ inputs.fuzz_seconds || '3600' }} 2>&1 | tee fuzz.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-log
          path: fuzz.log

  bench:
    name: benchmark run (manual gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libasound2-dev
      - run: |
          cargo bench --workspace --locked -- --noplot 2>&1 | tee bench.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-log
          path: bench.log


  macos-vulkan:
    name: macOS MoltenVK probe
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install MoltenVK + loader
        run: |
          brew install molten-vk vulkan-loader glslang
          PREFIX=$(brew --prefix molten-vk)
          LOADER=$(brew --prefix vulkan-loader)
          ICD=$(find "$PREFIX/share/vulkan/icd.d" "$PREFIX/etc/vulkan/icd.d" -name 'MoltenVK_icd.json' 2>/dev/null | head -1)
          test -n "$ICD" || { echo "MoltenVK ICD json not found"; exit 1; }
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PREFIX/lib:$LOADER/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: cargo run --release --locked -p moba-tools --bin vulkan-probe

  match-soak:
    name: 50-match deterministic soak
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install shader compiler
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libasound2-dev
      - run: |
          cargo run --release --locked -p moba-tools --bin match-soak -- --matches ${{ inputs.match_count || '50' }} --ticks 36000 2>&1 | tee match-soak.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: match-soak-log
          path: match-soak.log

  notify-failure:
    name: open/refresh nightly failure issue
    needs: [soak, fuzz, bench, macos-vulkan, match-soak]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly hardening failed (${context.runId})`,
              body: `Nightly workflow failed.\n\nRun: ${url}\n\nCheck the soak/fuzz/bench/macOS/match-soak artifacts before rerunning.`,
              labels: ['infrastructure', 'p1'],
            });
