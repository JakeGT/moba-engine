name: Feature request
description: Propose an engine, content or tooling improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you build or play today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API/wire/content impact and alternatives considered.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - simulation/game/content
        - networking/security
        - rendering/platform/client
        - tooling/docs
        - other
