name: Bug report
description: Something is broken or unexpected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please include evidence and how to reproduce.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behavior, logs, crash output, screenshots.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, content pack, seed/replay, OS/driver and hardware.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version/commit
      placeholder: git commit or tag
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
        - label: I can reproduce with the current main branch
