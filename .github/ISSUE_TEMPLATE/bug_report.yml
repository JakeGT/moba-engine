name: Bug report
description: Something is broken or behaves unexpectedly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. Do not include security vulnerabilities here; see SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, seed, content, inputs, and the shortest sequence that shows the issue.
      placeholder: |
        cargo run -p moba-server -- --ticks 1000 --seed 123
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, Windows, macOS, Other/unknown]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots / state hash
      description: Paste relevant output. Use code fences.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: This is not a security issue.
          required: true
