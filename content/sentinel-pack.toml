name = "Sentinel Pack"
version = "1.0.0"
author = "MOBA Engine"

# Example pack that references a visual asset (#285). The default heroes, with Guardian drawn
# by the shipped `models/sentinel.glb`; every other hero keeps the procedural rig.
#
#   cargo run -p moba-tools --bin content-check -- content/sentinel-pack.toml
#   MOBA_CONTENT=content/sentinel-pack.toml cargo run -p moba-client
#
# `[assets]` paths are relative to this file's directory and are checked by content-check
# only. Clients never see them: a hero's `model` *name* travels in the catalogue and each
# client resolves it against its own asset root (`MOBA_ASSET_ROOT`, default `content`) as
# `<root>/models/<name>.glb`, falling back to the rig. Keep unit paths at `models/<name>.glb`
# so the pack directory works as an asset root.

[[assets.units]]
name = "sentinel"
path = "models/sentinel.glb"

[[heroes]]
name = "Blade"
max_health = 760
max_mana = 280
health_regen_per_tick = 2
mana_regen_per_tick = 4
attack_damage = 62
attack_range = 2.0
attack_interval_ticks = 32
move_speed = 7.0
armor = 28
magic_resist = 22
vision_range = 14.0
abilities = [0, 1, 2]

[[heroes]]
name = "Ranger"
max_health = 540
max_mana = 320
health_regen_per_tick = 1
mana_regen_per_tick = 4
attack_damage = 54
attack_range = 9.0
attack_interval_ticks = 30
move_speed = 7.0
armor = 18
magic_resist = 18
vision_range = 15.0
abilities = [3, 4, 5]

[[heroes]]
name = "Mage"
max_health = 500
max_mana = 420
health_regen_per_tick = 1
mana_regen_per_tick = 5
attack_damage = 42
attack_range = 8.0
attack_interval_ticks = 34
move_speed = 6.0
armor = 14
magic_resist = 24
vision_range = 14.0
abilities = [6, 7, 8]

[[heroes]]
name = "Guardian"
max_health = 900
max_mana = 300
health_regen_per_tick = 2
mana_regen_per_tick = 3
attack_damage = 46
attack_range = 2.0
attack_interval_ticks = 36
move_speed = 6.0
armor = 36
magic_resist = 30
vision_range = 13.0
abilities = [9, 10, 11]
model = "sentinel"

[[heroes]]
name = "Assassin"
max_health = 560
max_mana = 300
health_regen_per_tick = 1
mana_regen_per_tick = 4
attack_damage = 68
attack_range = 2.0
attack_interval_ticks = 28
move_speed = 8.0
armor = 22
magic_resist = 18
vision_range = 13.0
abilities = [12, 13, 14]
