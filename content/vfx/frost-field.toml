# Frost Field: a slowing area with drifting snow (ADR-0013). Client-local and cosmetic: never hashed, signed or sent.
# Format: docs/content-authoring.md#vfx
duration = 1.2
importance = "high"

[[emitters]]
primitive = "ring"
sprite = "rune"
burst = 1
lifetime = [1.4, 1.4]
size = [16.0, 16.0]
color = [0.5, 1.1, 2.0, 0.55]
color_end = [0.3, 0.7, 1.4, 0.0]
telegraph = true

[[emitters]]
sprite = "star"
blend = "alpha"
rate = 80
lifetime = [0.8, 1.2]
speed = [0.3, 1.0]
direction = "up"
shape = "disc"
radius = 7.5
size = [0.25, 0.45]
spin = [-90, 90]
color = [0.8, 0.95, 1.2, 0.9]
color_end = [0.6, 0.8, 1.0, 0.0]
offset = [0, 0.3, 0]

# Dynamic point light (R2b, ADR-0016): lights the ground and units around the effect.
[light]
color = [0.3, 0.6, 1.0]
intensity = 4.0
radius = 2.0
scale_with_radius = true
fade_in = 0.2
fade_out = 0.4

[[decals]]                       # R3b: the area telegraph on the ground (ADR-0017 §1)
shape = "ring"
radius = 8.0
width = 0.35
color = [0.5, 1.1, 2.0, 0.5]
telegraph = true
progress = true
lifetime = 1.4

[[decals]]                       # frost left on the ground
shape = "disc"
radius = 7.5
color = [0.70, 0.85, 1.0, 0.35]
lifetime = 4.0
fade_out = 1.5
stamp = true
style = "paint"
