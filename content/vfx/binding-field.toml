# Binding Field: a rooting circle of lightning (ADR-0013). Client-local and cosmetic: never hashed, signed or sent.
# Format: docs/content-authoring.md#vfx
duration = 1.0
importance = "high"

[[emitters]]
primitive = "ring"
sprite = "rune"
burst = 1
lifetime = [1.2, 1.2]
size = [14.0, 14.0]
color = [1.8, 1.4, 0.4, 0.6]
color_end = [1.0, 0.7, 0.2, 0.0]
telegraph = true

[[emitters]]
primitive = "flipbook"
sprite = "lightning"
rate = 16
lifetime = [0.15, 0.25]
shape = "circle"
radius = 6.5
size = [1.6, 2.4]
spin = [-90, 90]
color = [2.4, 1.8, 0.6, 1.0]
offset = [0, 0.8, 0]
fps = 30

# Dynamic point light (R2b, ADR-0016): lights the ground and units around the effect.
[light]
color = [1.0, 0.8, 0.2]
intensity = 3.0
radius = 2.0
scale_with_radius = true
fade_in = 0.1
fade_out = 0.3

[[decals]]                       # R3b: the area telegraph on the ground (ADR-0017 §1)
shape = "ring"
radius = 7.0
width = 0.35
color = [1.8, 1.4, 0.4, 0.55]
telegraph = true
progress = true
lifetime = 1.2
