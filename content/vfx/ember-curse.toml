# Ember Curse: a burning area (ADR-0013). Client-local and cosmetic: never hashed, signed or sent.
# Format: docs/content-authoring.md#vfx
duration = 1.0
importance = "high"

[[emitters]]
primitive = "ring"
sprite = "ring"
burst = 1
lifetime = [1.2, 1.2]
size = [12.0, 12.0]
color = [2.0, 0.7, 0.2, 0.6]
color_end = [1.2, 0.3, 0.1, 0.0]
telegraph = true

[[emitters]]
sprite = "dot"
rate = 90
lifetime = [0.5, 1.0]
speed = [1.5, 3.5]
direction = "up"
spread = 25
shape = "disc"
radius = 5.5
size = [0.4, 0.7]
size_end = 0.2
color = [3.0, 1.2, 0.3, 1.0]
color_end = [1.5, 0.3, 0.1, 0.0]

[[emitters]]                     # heat haze over the curse (ADR-0019; High and up, else skipped)
blend = "distortion"
burst = 3
rate = 6
lifetime = [1.0, 1.4]
speed = [0.4, 0.8]
direction = "up"
spread = 10
shape = "disc"
radius = 3.5
size = [3.5, 4.5]
size_end = 1.2
offset = [0, 1.4, 0]
distortion = 0.6
distortion_end = 0.0
distortion_scale = 2.0
distortion_speed = 1.0

# Dynamic point light (R2b, ADR-0016): lights the ground and units around the effect.
[light]
color = [1.0, 0.35, 0.1]
intensity = 4.0
radius = 5.0
fade_out = 0.4
flicker = 0.25

[[decals]]                       # R3b: the area telegraph on the ground (ADR-0017 §1)
shape = "ring"
radius = 6.0
width = 0.35
color = [2.0, 0.7, 0.2, 0.55]
telegraph = true
progress = true
lifetime = 1.2

[[decals]]                       # a scorch mark
shape = "splat"
radius = 4.0
color = [0.05, 0.03, 0.02, 0.7]
lifetime = 8.0
fade_out = 2.5
stamp = true
