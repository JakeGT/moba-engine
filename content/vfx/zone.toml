# Default zone: a telegraph ring for the zone's lifetime (ADR-0013). Client-local and cosmetic: never hashed, signed or sent.
# Format: docs/content-authoring.md#vfx
duration = 1.0
event_duration = true
importance = "high"

[[emitters]]
primitive = "ring"
sprite = "ring"
burst = 1
rate = 2
lifetime = [1.0, 1.0]
size = [2.0, 2.0]
size_end = 2.05
scale_with_radius = true
color = [1.5, 1.5, 1.5, 0.5]
color_end = [1.5, 1.5, 1.5, 0.0]
team_tint = 0.7
telegraph = true

# Dynamic point light (R2b, ADR-0016): lights the ground and units around the effect.
[light]
color = [1.0, 1.0, 1.0]
intensity = 2.0
radius = 2.0
scale_with_radius = true
team_tint = 0.6
fade_in = 0.2
fade_out = 0.3

[[decals]]                       # R3b: the area telegraph on the ground (ADR-0017 §1)
shape = "ring"
radius = 1.0
width = 0.1
color = [1.5, 1.5, 1.5, 0.45]
telegraph = true
progress = true
scale_with_radius = true
team_tint = 0.7
