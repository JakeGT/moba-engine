# VFX bindings (ADR-0013): which effect each ability and unit event plays.
#
# Client-local and cosmetic: never hashed, signed or sent on the wire. A missing or invalid
# effect file is logged once and plays nothing. Format: docs/content-authoring.md#vfx

[defaults]
cast = "cast-flash"
projectile = "bolt"
hit = "impact"
zone = "zone"
hero_death = "hero-death"
minion_death = "minion-death"
structure_destroyed = "collapse"
attack = "attack-hit"

