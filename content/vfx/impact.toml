# Default projectile impact (ADR-0013). Client-local and cosmetic: never hashed, signed or sent.
# Format: docs/content-authoring.md#vfx
duration = 0.1
importance = "normal"

[[emitters]]
primitive = "flipbook"
sprite = "burst"
burst = 1
lifetime = [0.3, 0.3]
size = [2.0, 2.0]
size_end = 1.5
color = [2.0, 1.4, 0.8, 1.0]
fps = 48

[[emitters]]
sprite = "spark"
burst = 10
lifetime = [0.2, 0.4]
speed = [4, 8]
direction = "random"
size = [0.6, 1]
color = [2.0, 1.5, 0.9, 1.0]
drag = 3

# Dynamic point light (R2b, ADR-0016): lights the ground and units around the effect.
[light]
color = [1.0, 0.7, 0.4]
intensity = 5.0
radius = 5.0
duration = 0.05
fade_out = 0.25

[[decals]]                       # R3b: a small scorch (ADR-0017 §1)
shape = "splat"
radius = 0.9
color = [0.05, 0.035, 0.025, 0.55]
lifetime = 4.0
fade_out = 1.5
stamp = true
