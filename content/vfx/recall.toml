# Recall: a ground ring drawing in on the hero and a rising column of light for the channel
# (8 s by default), stopped early when the recall is cancelled or completes (ADR-0013).
# Not an area telegraph: nothing here warns about damage. Client-local and cosmetic: never
# hashed, signed or sent. Format: docs/content-authoring.md#vfx
duration = 8.0
event_duration = true
importance = "normal"

# The ground ring: contracting pulses in the team colour.
[[emitters]]
primitive = "ring"
sprite = "ring"
burst = 1
rate = 1.5
lifetime = [1.2, 1.2]
size = [3.2, 3.2]
size_end = 0.45
color = [0.9, 1.3, 2.0, 0.0]
color_end = [1.2, 1.6, 2.4, 0.8]
team_tint = 0.5

# The column: motes rising from a circle at the hero's feet.
[[emitters]]
sprite = "spark"
rate = 36
lifetime = [0.9, 1.3]
speed = [2.5, 4.0]
direction = "up"
spread = 4
shape = "circle"
radius = 0.9
size = [0.25, 0.45]
size_end = 0.3
color = [1.0, 1.4, 2.4, 1.0]
color_end = [0.6, 0.9, 2.0, 0.0]
team_tint = 0.4

# The column's soft core.
[[emitters]]
sprite = "beam"
rate = 4
lifetime = [0.8, 0.8]
offset = [0, 1.6, 0]
size = [1.4, 1.6]
size_end = 1.2
color = [0.6, 0.9, 1.8, 0.35]
color_end = [0.6, 0.9, 1.8, 0.0]
team_tint = 0.4

# Dynamic point light (R2b, ADR-0016): a soft glow on the ground for the channel.
[light]
color = [0.5, 0.8, 1.6]
intensity = 3.0
radius = 4.0
fade_in = 0.4
fade_out = 0.4
team_tint = 0.4
