# Sample material for the material-model sheet (ADR-0023 gate 5 and 8; one sphere per
# shading model, MOBA_MATERIAL_SHEET=samples). Textures: texture-bake material-sample
# (scripts/bake-sample-textures.sh). docs/content-authoring.md#materials has the keys.
# THIN_FILM: heat-tinted dark alloy; the model texture's R sweeps the film from its minimum
# to its maximum thickness around the sphere.
shader = "textured"
base_color = "material-sample-base"
metallic_roughness = "material-sample-mr"
model_texture = "material-sample-model"
base_color_factor = [0.45, 0.42, 0.40, 1.0]
metallic = 1.0
roughness = 0.3
model = "thin_film"
[thin_film]
thickness_min = 150.0
thickness_max = 400.0
ior = 1.6
