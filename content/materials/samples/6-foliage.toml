# Sample material for the material-model sheet (ADR-0023 gate 5 and 8; one sphere per
# shading model, MOBA_MATERIAL_SHEET=samples). Textures: texture-bake material-sample
# (scripts/bake-sample-textures.sh). docs/content-authoring.md#materials has the keys.
# FOLIAGE: leaf green with the default translucency.
shader = "textured"
base_color = "material-sample-base"
metallic_roughness = "material-sample-mr"
base_color_factor = [0.20, 0.42, 0.12, 1.0]
metallic = 0.0
roughness = 0.7
model = "foliage"
[foliage]
translucency = 0.35
