# Sample material for the material-model sheet (ADR-0023 gate 5 and 8; one sphere per
# shading model, MOBA_MATERIAL_SHEET=samples). Textures: texture-bake material-sample
# (scripts/bake-sample-textures.sh). docs/content-authoring.md#materials has the keys.
# Transmissive (TRANSMISSIVE_FALLBACK in the G-buffer until N2f's glass pass): a pale
# crystal with an emissive core in the mask band (metallic_roughness.b).
shader = "textured"
base_color = "material-sample-base"
metallic_roughness = "material-sample-mr"
emissive_texture = "material-sample-emissive"
base_color_factor = [0.70, 0.85, 0.95, 1.0]
emissive = [0.6, 1.2, 1.6]
metallic = 0.0
roughness = 0.1
model = "transmissive"
ior = 1.5
