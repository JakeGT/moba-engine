# Map visuals descriptor for `visuals = "ember"` (content/ember-map.toml), #287.
# Client-local and cosmetic: never hashed or sent. See docs/content-authoring.md#map-visuals.
terrain = [0.24, 0.09, 0.05]   # scorched ground (linear RGB, 0..=1)
wall = [0.55, 0.20, 0.08]      # rust-red ramparts
wall_height = 6.0
wall_mesh = "rampart"          # models/rampart.glb, stretched along each wall

# Ember crystals around the crossing.
[[props]]
position = [96, 72]
color = [1.0, 0.42, 0.10]
height = 11.0
mesh = "crystal"

[[props]]
position = [160, 184]
color = [1.0, 0.42, 0.10]
height = 11.0
yaw = 180.0
mesh = "crystal"

[[props]]
position = [128, 128]
color = [1.0, 0.62, 0.18]
height = 16.0
yaw = 45.0
mesh = "crystal"

[[props]]
position = [52, 84]
color = [0.85, 0.30, 0.08]
height = 8.0
yaw = 90.0
mesh = "crystal"

[[props]]
position = [204, 172]
color = [0.85, 0.30, 0.08]
height = 8.0
yaw = 270.0
mesh = "crystal"

# Lighting and art direction (R2a, ADR-0011): a low, hot sun through smoke, ember-orange
# rims so units read against the scorched ground, warm painted specular.
[lighting]
environment = "ember"            # environments/ember.{toml,ktx2}: env-bake --preset ember
sun_direction = [-0.6, 0.35, 0.45]  # the ember sky's sun glow direction
sun_color = [1.0, 0.84, 0.70]    # warm, but not so orange that blue units turn grey (rule 1)
sun_intensity = 1.4
ibl_intensity = 0.3                # the smoky orange sky would grey out blue units (rule 1)
shadow_strength = 0.8
shadow_softness = 0.04
wrap = 0.3
rim = 0.45
rim_color = [1.0, 0.75, 0.5]
specular_tint = [1.0, 0.8, 0.6]
# Baked AO (R2b, ADR-0016): maps/ao/ember-ao.{toml,ktx2}, scripts/bake-map-ao.sh.
baked_ao = "ember-ao"
ao_strength = 0.85
