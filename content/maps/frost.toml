# Map visuals descriptor for `visuals = "frost"` (content/frost-map.toml), #287.
# Client-local and cosmetic: never hashed or sent. See docs/content-authoring.md#map-visuals.
wall = [0.30, 0.55, 0.85]      # glacier-blue ice walls (built-in blocks: no wall_mesh)
wall_height = 9.0

# Frozen sentinel statues guarding the ring.
[[props]]
position = [128, 128]
color = [0.80, 0.92, 1.00]
height = 18.0
yaw = 135.0
mesh = "sentinel"

[[props]]
position = [76, 76]
color = [0.55, 0.75, 0.95]
height = 12.0
yaw = 315.0
mesh = "sentinel"

[[props]]
position = [180, 180]
color = [0.55, 0.75, 0.95]
height = 12.0
yaw = 135.0
mesh = "sentinel"

# Ice pillars (no mesh: the built-in block).
[[props]]
position = [76, 180]
color = [0.70, 0.88, 1.00]
height = 14.0
yaw = 45.0

[[props]]
position = [180, 76]
color = [0.70, 0.88, 1.00]
height = 14.0
yaw = 45.0

# Lighting and art direction (R2a, ADR-0011): a high, cold sun over snow, a bright bounce from
# the ground in the environment, soft cyan rims and slightly glossier ice.
[lighting]
environment = "frost"            # environments/frost.{toml,ktx2}: env-bake --preset frost
sun_direction = [0.3, 0.8, -0.5]
sun_color = [0.92, 0.96, 1.0]
sun_intensity = 1.0
ibl_intensity = 0.35
shadow_strength = 0.7
wrap = 0.15
rim = 0.3
rim_color = [0.6, 0.85, 1.0]
unit_roughness = 0.45
terrain_roughness = 0.7
# Baked AO (R2b, ADR-0016): maps/ao/frost-ao.{toml,ktx2}, scripts/bake-map-ao.sh.
baked_ao = "frost-ao"
ao_strength = 0.8

# Terrain (R3a, ADR-0014): packed snow in a ring of drifts, icy lanes, blue-grey rock.
[terrain]
tint = [0.62, 0.70, 0.80]        # the flat plane's tint (packed snow, linear RGB 0..=1)
relief = 0.25                    # metres, at most 0.5 on the board
edge = "hills"
edge_height = 24.0
lane_width = 11.0
seed = 7

[[terrain.layers]]               # 1: base ground, packed snow
albedo = "terrain-pebbles"
normal = "terrain-pebbles-normal"
tint = [1.60, 1.72, 1.90]
tiling = 5.0

[[terrain.layers]]               # 2: icy, trodden lanes
albedo = "terrain-dirt"
normal = "terrain-dirt-normal"
tint = [0.95, 1.15, 1.50]
tiling = 6.0

[[terrain.layers]]               # 3: blue-grey rock on the slopes and under the ice walls
albedo = "terrain-rock"
normal = "terrain-rock-normal"
tint = [0.75, 0.85, 1.05]
tiling = 10.0

[[terrain.layers]]               # 4: frozen tundra patches in the snow
albedo = "terrain-moss"
normal = "terrain-moss-normal"
tint = [1.10, 1.30, 1.50]
tiling = 8.0

# A pale cyan haze over the snow and a cold, clear sky.
[atmosphere]
fog_color = [0.70, 0.84, 0.92]
fog_density = 0.0025
fog_height = 25.0
fog_start = 80.0
fog_max = 0.7
sky_zenith = [0.35, 0.55, 0.78]
sky_horizon = [0.75, 0.88, 0.95]

# Unseen ground: dim, cold and drifting with snow mist.
[fog_of_war]
color = [0.10, 0.14, 0.20]
darken = 0.6
desaturate = 0.6
mist_height = 4.0
mist = 0.5
# Post-processing (R6): the cool, crisp frost grade; restrained bloom over bright snow.
[post]
exposure = 0.0                   # EV stops
bloom = 0.04
grading = "frost"                # grading/frost.cube: grade-bake bake --preset frost --size 17
grading_strength = 0.85
# Foliage (R3b, ADR-0017): a thin scatter of frosted tundra grass poking through the snow.
# Decorative only: the simulation has no brush.
[foliage]
density = 1.5
height = [0.15, 0.35]
base_color = [0.10, 0.13, 0.12]
tip_color = [0.62, 0.70, 0.72]
flower_color = [0.85, 0.9, 1.0]
wind = [-0.8, 0.5]
wind_speed = 1.4
reeds = false
seed = 23
