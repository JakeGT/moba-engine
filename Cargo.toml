[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["MOBA Engine contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/JakeGT/moba-engine"
homepage = "https://github.com/JakeGT/moba-engine"
keywords = ["game", "gamedev", "engine", "moba", "vulkan"]
categories = ["game-engines", "game-development"]
# Publishing stays opt-in until crate names/ownership and the release policy are settled.
publish = false

[workspace.dependencies]
# Internal crates. Layering is enforced by `just layering`.
moba-core = { path = "crates/core", version = "0.3.0" }
moba-ecs = { path = "crates/ecs", version = "0.3.0" }
moba-jobs = { path = "crates/jobs", version = "0.3.0" }
moba-platform = { path = "crates/platform", version = "0.3.0" }
moba-shaders = { path = "crates/shaders", version = "0.3.0" }
moba-render = { path = "crates/render", version = "0.3.0" }
moba-assets = { path = "crates/assets", version = "0.3.0" }
moba-nav = { path = "crates/nav", version = "0.3.0" }
moba-sim = { path = "crates/sim", version = "0.3.0" }
moba-game = { path = "crates/game", version = "0.3.0" }
moba-net = { path = "crates/net", version = "0.3.0" }
moba-netsim = { path = "crates/netsim", version = "0.3.0" }

# Third-party. Versions are resolved once here so every crate agrees.
arrayvec = "0.7"
ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1", features = ["derive"] }
crossbeam-deque = "0.8"
crossbeam-queue = "0.3"
chacha20poly1305 = "0.10"
getrandom = "0.2"
ctrlc = { version = "3", features = ["termination"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
glam = "0.30"
gpu-allocator = "0.27"
raw-window-handle = "0.6"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }

# Dev-only.
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri)'] }
missing_debug_implementations = "warn"
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
# Pedantic lints that are noise for engine code.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"

[profile.dev]
# Keep debug builds playable: optimise dependencies, not our code.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Release + symbols for Tracy / perf / RenderDoc captures.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
