[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["MOBA Engine contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/JakeGT/moba-engine"
homepage = "https://github.com/JakeGT/moba-engine"
keywords = ["game", "gamedev", "engine", "moba", "vulkan"]
categories = ["game-engines", "game-development"]
# Publishing stays opt-in until crate names/ownership and the release policy are settled.
publish = false

[workspace.dependencies]
# Internal crates. Layering is enforced by `just layering`.
moba-core = { path = "crates/core", version = "0.4.0" }
moba-ecs = { path = "crates/ecs", version = "0.4.0" }
moba-jobs = { path = "crates/jobs", version = "0.4.0" }
moba-platform = { path = "crates/platform", version = "0.4.0" }
moba-shaders = { path = "crates/shaders", version = "0.4.0" }
# Without default features so `fsr3` (on by default) follows the dependent's own feature.
moba-render = { path = "crates/render", version = "0.4.0", default-features = false }
moba-assets = { path = "crates/assets", version = "0.4.0" }
moba-nav = { path = "crates/nav", version = "0.4.0" }
moba-sim = { path = "crates/sim", version = "0.4.0" }
moba-game = { path = "crates/game", version = "0.4.0" }
moba-net = { path = "crates/net", version = "0.4.0" }
moba-netsim = { path = "crates/netsim", version = "0.4.0" }

# Third-party. Versions are resolved once here so every crate agrees.
arrayvec = "0.7"
# `provisional` exposes VK_KHR_portability_subset (MoltenVK), which ash master gates behind it.
ash = { version = "0.38", features = ["provisional"] }
ash-window = "0.13"
bytemuck = { version = "1", features = ["derive"] }
crossbeam-deque = "0.8"
crossbeam-queue = "0.3"
# `zeroize` restores the key wiping 0.10 did unconditionally.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
getrandom = "0.4"
ctrlc = { version = "3", features = ["termination"] }
hkdf = "0.13"
hmac = "0.13"
sha2 = "0.11"
ed25519-dalek = "3"
serde = { version = "1", features = ["derive"] }
# Device-capability dumps (`vulkan-probe --json`) and their test fixtures (ADR-0020 §2b).
serde_json = "1"
toml = "1"
glam = "0.34"
# Binary glTF (.glb) parsing for the asset loader (ADR-0007). Exact pin; no import/image/base64.
gltf = { version = "=1.4.1", default-features = false }
# Safe, no_std, dependency-free BC1-BC7 block decoder: the CPU fallback for devices without
# textureCompressionBC and the bake tool's quality check (ADR-0010). Exact pin.
bcdec_rs = "=0.2.1"
# PNG decode/encode for the offline texture baker (moba-tools only, ADR-0010).
png = "0.18"
# meshoptimizer bindings (MIT OR Apache-2.0; bundles meshoptimizer, MIT) for the offline mesh
# LOD baker (moba-tools only, R8, ADR-0018). Exact pin; the client never links it.
meshopt = { version = "=0.7.0", default-features = false }
# MikkTSpace tangents (A0, ADR-0022): a safe, dependency-free Rust port of the reference C,
# byte-identical to it (Zlib AND (MIT OR Apache-2.0)). Exact pin; `no_std`, so moba-assets
# supplies its own deterministic `acos` and the result is the same on every platform.
bevy_mikktspace = { version = "=1.0.0", default-features = false }
# ADR-0020 §1: the ash-next branch; released 0.28.0 does not build against ash master. Its own
# [patch] (a Traverse ash fork) is ignored here, so re-check that it builds on each ash re-pin.
gpu-allocator = { git = "https://github.com/Traverse-Research/gpu-allocator", rev = "6a68a5b4c233361c07dfa8865043a16ade7512db", default-features = false, features = ["vulkan", "std"] }
raw-window-handle = "0.6"
# Vendor SDK features of moba-render only (ADR-0020 §6b). bindgen is a build dependency that
# needs libclang; `runtime` loads it with dlopen. libloading is already in the graph via ash.
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
cmake = "0.1"
libloading = "0.8"
# The NGX data directory's owner check (`geteuid`, `dlss` on Unix). Already in the graph.
libc = "0.2"
cpal = "0.18"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }

# Dev-only.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
loom = "0.7"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(miri)'] }
missing_debug_implementations = "warn"
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
# Pedantic lints that are noise for engine code.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"

[profile.dev]
# Keep debug builds playable: optimise dependencies, not our code.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Release + symbols for Tracy / perf / RenderDoc captures.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false

[patch.crates-io]
# ADR-0020 §1: Vulkan 1.4.352 headers; no ash release after 0.38.0 (2024-04-01). The patch keeps
# exactly one `ash` in the graph. Return to crates.io once ash 0.39+ and a matching
# gpu-allocator release exist.
ash = { git = "https://github.com/ash-rs/ash", rev = "8844f6b4eefb16d08cd73c8f3d340e1ac12deb16" }
ash-window = { git = "https://github.com/ash-rs/ash", rev = "8844f6b4eefb16d08cd73c8f3d340e1ac12deb16" }
