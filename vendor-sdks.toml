# Pinned vendor SDKs behind moba-render's optional features (ADR-0020 §6).
#
# Nothing listed here is vendored. `scripts/fetch-sdks.sh` (`scripts/fetch-sdks.ps1` on Windows)
# downloads each archive from the official GitHub release or tag/commit archive below into
# `${MOBA_SDK_DIR:-target/vendor-sdks}/<dir>/`, checks the archive's SHA-256, unpacks it and
# checks the SHA-256 of its licence file. A changed licence text fails the fetch: re-read the
# licence (roadmap §7), record the re-read in the PR, then update `licence_sha256`.
# `crates/render/build.rs` reads this file and the `.moba-sdk-sha256` stamp the fetch writes;
# it never downloads.
#
# Fields:
#   name             the entry's name (`--only` accepts entry and feature names)
#   features         the moba-render features that need it (sub-entries inherit the parent's)
#   parent           for a git submodule or CMake download: the entry it is unpacked into
#   version          upstream version label
#   repository       the GitHub repository the archive comes from
#   tag              the git tag ("" for an untagged commit pin)
#   commit           the full commit the archive was made from
#   url              the archive (an official GitHub release asset or tag/commit archive)
#   sha256           SHA-256 of the archive
#   github_digest    the `digest` GitHub's releases API publishes for a release asset, which
#                    must equal sha256; "" for tag and commit archives (GitHub publishes none)
#   strip            the archive's top-level directory, removed when unpacking ("" for none)
#   dir              where it is unpacked, relative to MOBA_SDK_DIR
#   licence          the licence file, relative to `dir`
#   licence_sha256   SHA-256 of that file, exactly as unpacked
#   licence_name     what the licence is (read in full when pinned)
#   platforms        where the SDK ships run-time binaries or builds (headers are used on every
#                    platform the feature compiles on; see docs/dev/vendor-sdks.md)
#   status           "verified" (archive and licence hashed and the licence read) or
#                    "unverified" (not fetchable without a login or click-through; skipped)
#
# Pinned and verified 2026-11-01. The release-asset digests were cross-checked against
# `gh api repos/<repo>/releases/tags/<tag>` on that date.

schema = 1

